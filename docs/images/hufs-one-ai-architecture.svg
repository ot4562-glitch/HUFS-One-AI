<title id="title">HUFS One AI — 시스템 아키텍처</title><desc id="desc">합성 시연 학생 또는 권한 있는 사용자에서 React/Vite 프런트엔드를 거쳐 Fastify API로 요청하고, 검증된 입력·순수 도메인 코어·PostgreSQL로 연결한다. OCR, HCX, Laya와 NCP 운영은 별도 구성 및 인수가 필요하며 현재 실서비스 출시는 차단되어 있다.</desc>
