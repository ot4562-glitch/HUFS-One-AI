name: hufs-private
services:
  api:
    profiles: [private-deployment]
    image: ${HUFS_API_IMAGE:?explicit reviewed local image required}
    environment:
      APP_ENV: production
      NODE_ENV: production
      HUFS_API_INTERNAL_PORT: "3000"
      HUFS_API_BIND_HOST: ${HUFS_API_BACKEND_IPV4:?operator-reviewed private API IPv4 required}
      HUFS_PRODUCTION_CONFIG: /etc/hufs-one/private/production.mjs
      AI_PROVIDER_ENABLED: "false"
      LAYA_ENABLED: "false"
    env_file:
      - ${HUFS_OPERATOR_ROOT:?external operator directory required}/api.env
    volumes:
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/production.mjs
        target: /etc/hufs-one/private/production.mjs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/auth
        target: /run/operator/auth
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/db
        target: /run/operator/db
        read_only: true
        bind: {create_host_path: false}
    # External OIDC/SMTP/approved model and database traffic is allowed only
    # through an operator-provisioned, independently filtered egress network.
    networks:
      backend:
        ipv4_address: ${HUFS_API_BACKEND_IPV4:?operator-reviewed private API IPv4 required}
      approved-egress: {}
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    restart: "no"
  edge:
    profiles: [private-deployment]
    image: ${HUFS_EDGE_IMAGE:?explicit reviewed local image required}
    depends_on: [api]
    ports:
      - "${HUFS_HTTPS_BIND_IP:-127.0.0.1}:443:8443"
    volumes:
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/nginx/private.conf
        target: /etc/nginx/private.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/nginx/private-proxy.conf
        target: /etc/nginx/private-proxy.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HUFS_OPERATOR_ROOT}/tls
        target: /run/operator/tls
        read_only: true
        bind: {create_host_path: false}
    networks:
      backend:
        ipv4_address: ${HUFS_EDGE_IPV4:?operator-reviewed ingress IPv4 required}
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
# No database creation or published API/DB ports. An operator must separately
# provide approved durable DB connectivity and firewall evidence; never guessed.
# Operator must review the private subnet, static edge IP, host routing and
# XFF overwrite together. Never infer a trusted proxy from arbitrary Docker DNS.
# The private-deployment profile is disabled by default. Explicit invocation,
# external reviewed egress, production factory and runtime tests are required.
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${HUFS_BACKEND_SUBNET:?operator-reviewed private subnet required}
  approved-egress:
    external: true
    name: ${HUFS_APPROVED_EGRESS_NETWORK:?preprovisioned filtered egress network required}
