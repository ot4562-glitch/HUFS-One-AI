name: "웹 UI/UX 구현"
description: "기존 API/계약에 맞는 React 화면·디자인·접근성 독립 작업"
title: "[웹 구현] "
body:
  - type: markdown
    attributes:
      value: |
        에이전트: 제목 맨 앞 표준 접두어를 변경하지 마세요. 저장소 AGENTS.md와 docs/ISSUE_ASSIGNMENT_PLAYBOOK.md를 먼저 확인하세요.
        우선순위 P0/P1/P2/P3는 제목에, 강도 S/M/L은 검토 후 effort:S/M/L 라벨로 표시하세요.
        P0·보안/개인정보 위험은 자동 담당 배정하지 않고 사람이 검토합니다. 실제 취약점 상세는 공개 이슈에 적지 마세요.
        기존 고정 역할 이슈 #355-#359는 어떤 내용도 변경/댓글 추가하지 않습니다.
        실학생 정보, csv/ 원본, 비밀키 및 미확인 학교 원문을 본문에 포함하지 않습니다.
        이서연이 웹 구현을 맡습니다. 새 전체 제품 기능이면 '[추가 기능]' 템플릿을 사용하세요.
  - type: input
    id: parent
    attributes:
      label: "관련 기능 이슈/완료된 API 계약"
      placeholder: "#번호와 route/DTO 또는 관련 PR"
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: "화면·사용자 동선·시각 자산"
      placeholder: "경로/컴포넌트·데이터/이미지 권리·반응형/접근성"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "테스트/수락 기준"
      placeholder: "모바일/키보드/스크린리더/접근제어/실연결 여부"
    validations:
      required: true
