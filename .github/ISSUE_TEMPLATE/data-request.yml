name: "김채윤 데이터 요청"
description: "별도 데이터 요청 이슈를 생성해 공식 출처·권리·포스터·독립 Gold를 인수합니다."
title: "[데이터 요청][김채윤] "
assignees:
  - qamarrchae
body:
  - type: markdown
    attributes:
      value: |
        이슈는 김채윤에게 배정됩니다. 관련 [추가 기능] 이슈에도 김채윤을 공동 assignee로 지정하고 이 요청과 서로 링크하세요.
        역할 이슈 [본선 진출 이후] #355–#359는 수정하거나 댓글을 달지 않습니다.
        13개 기존 기능 공통 자료는 #360에 정리되어 있습니다. 중복 요청 여부를 먼저 확인하세요.
  - type: input
    id: linked-feature
    attributes:
      label: "관련 추가 기능 이슈"
      description: "예: #361"
      placeholder: "#번호"
    validations:
      required: true
  - type: textarea
    id: data-details
    attributes:
      label: "필요한 데이터·필수 코드 DTO·필드"
      placeholder: "공식 공고·학사·포스터·활동·멘토·상담·NCS·통계·국제학생 등"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "공식 원문·출처·판본·시점"
      description: "sourceId, revisionId, verifiedAt, source span, campus/term, 공식 링크"
    validations:
      required: false
  - type: textarea
    id: rights
    attributes:
      label: "이용권·이미지·모델 전송·독립 Gold"
      description: "웹 게시·썸네일·OCR·HCX-007·원문 인용·보관·철회 권리 구분"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준·현재 상태"
      description: "수량은 실제 자료 수급/검수 후 결정합니다."
      placeholder: "공식 자료/권리/Gold/디자인 자산·정정, UNKNOWN/NOT_RUN 항목"
    validations:
      required: false
