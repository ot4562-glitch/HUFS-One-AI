name: "버그 보고 · 결함 조사"
description: "재현 가능한 오류 보고. 영역이 명확하지 않으면 자동 배정하지 않고 검토합니다."
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        **에이전트 필수:** AGENTS.md → docs/ISSUE_ASSIGNMENT_PLAYBOOK.md를 먼저 읽습니다.
        제목 첫머리 [버그]를 유지하고, 기존 이슈/PR과 중복되지 않는지 확인하세요.
        제목에 P0/P1/P2/P3 우선순위를 적고, 확실한 경우에만 area:web/ai/integration/data 라벨을 선택하세요.
        P0와 보안/개인정보 문제는 사람이 검토할 때까지 자동 배정하지 않습니다.
        비밀키, 학생 개인정보, 공격 재현 정보 등 민감한 내용은 **공개 이슈에 쓰지 마세요**.
        보안 취약점은 Security Advisory의 비공개 보고 또는 저장소 관리자에게 비공개로 알립니다.
        고정 역할 이슈 #355~#359는 수정/댓글 금지. csv/ 원본 5개 보존.
  - type: textarea
    id: observed
    attributes:
      label: "실제 결과와 기대 결과"
      placeholder: "어떤 화면/계약/API에서 어떤 문제가 발생했나요?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 단계 및 영향 범위"
      placeholder: "최소 재현, 관련 경로/버전, 실제/합성 구분; 비밀·학생 원본은 첨부하지 않음"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "기존 이슈·PR·코드 근거"
      placeholder: "#번호 및 파일/라인, 정적 분석인지 실제 실행 재현인지"
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: "수정 후 확인할 회귀 테스트와 완료 기준"
      placeholder: "반례/회귀 테스트, 불확실성, 코드와 운영 인수의 구분"
    validations:
      required: false
