name: "AI 구현 인계 작업"
description: "이미 범위를 정한 AI/코드 기반 AI 개발. 새 제품 기능 전체는 '추가 기능 제안'을 사용하세요."
title: "[AI 구현] "
body:
  - type: markdown
    attributes:
      value: |
        에이전트: 제목 맨 앞 표준 접두어를 변경하지 마세요. 저장소 AGENTS.md와 docs/ISSUE_ASSIGNMENT_PLAYBOOK.md를 먼저 확인하세요.
        우선순위 P0/P1/P2/P3는 제목에, 강도 S/M/L은 검토 후 effort:S/M/L 라벨로 표시하세요.
        P0·보안/개인정보 위험은 자동 담당 배정하지 않고 사람이 검토합니다. 실제 취약점 상세는 공개 이슈에 적지 마세요.
        기존 고정 역할 이슈 #355-#359는 어떤 내용도 변경/댓글 추가하지 않습니다.
        실학생 정보, csv/ 원본, 비밀키 및 미확인 학교 원문을 본문에 포함하지 않습니다.
        두 AI 개발자 중 현재 가중 업무량이 적은 사람에게 배정되며 상대는 교차검증합니다.
  - type: input
    id: parent-issue
    attributes:
      label: "상위 기능 이슈 번호 / 인계 근거"
      description: "선행 Core/API/DB 구현과 AI 경계를 명확하게 적습니다. 예: #341"
      placeholder: "#번호, 관련 PR 또는 파일 경로"
    validations:
      required: true
  - type: textarea
    id: ai-scope
    attributes:
      label: "AI 구현 범위와 기술"
      description: "HCX-007, CLOVA OCR, RAG, 추천/랭킹/예측 등 코드 기반 AI 포함"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: "검증/완료 기준"
      description: "정량 지표, 독립 Gold 여부, 근거/권리, FAIL/UNKNOWN, 예상 작업 강도"
    validations:
      required: true
