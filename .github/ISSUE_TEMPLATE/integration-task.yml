name: "기술 통합·서버·보안"
description: "비AI API/DB/보안/CI/NCP 등의 독립 구현·결함. 신규 기능은 별도 템플릿"
title: "[기술 통합] "
body:
  - type: markdown
    attributes:
      value: |
        에이전트: 제목 맨 앞 표준 접두어를 변경하지 마세요. 저장소 AGENTS.md와 docs/ISSUE_ASSIGNMENT_PLAYBOOK.md를 먼저 확인하세요.
        우선순위 P0/P1/P2/P3는 제목에, 강도 S/M/L은 검토 후 effort:S/M/L 라벨로 표시하세요.
        P0·보안/개인정보 위험은 자동 담당 배정하지 않고 사람이 검토합니다. 실제 취약점 상세는 공개 이슈에 적지 마세요.
        기존 고정 역할 이슈 #355-#359는 어떤 내용도 변경/댓글 추가하지 않습니다.
        실학생 정보, csv/ 원본, 비밀키 및 미확인 학교 원문을 본문에 포함하지 않습니다.
        심민성이 비AI Core/API/DB/보안/통합 작업을 처음 검토합니다.
  - type: textarea
    id: issue
    attributes:
      label: "문제/재현 또는 수정 목적"
      placeholder: "영향받은 API, 모듈/파일 경로, 실제 오류 또는 기대 동작"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "기존 이슈·PR·영향 범위"
      placeholder: "API/계약, 권한/출처, AI 또는 웹 협업 필요 여부"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "완료·안전 검증"
      placeholder: "단위/통합 테스트, CI/복구, 비용/권리, PASS/NOT_RUN"
    validations:
      required: true
