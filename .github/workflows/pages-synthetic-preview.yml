name: Private synthetic UI preview (GitHub Pages)

# Only the static, all-fictitious React UI is published. This does not deploy
# the NCP service or call Google, database or AI providers.
on:
  pull_request:
    paths:
      - '.github/workflows/pages-synthetic-preview.yml'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/ai/src/**'
      - 'packages/fixtures/synthetic/**'
      - 'tools/check_pages_preview.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify & build synthetic Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout allowlisted code-only sources and synthetic fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 pinned
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /packages/contracts/
            /packages/core/
            /packages/ui/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /apps/web/
            /apps/api/
            /tests/api/
            /tools/check_pages_preview.mjs
            /.github/workflows/pages-synthetic-preview.yml
      - name: Reject protected input directories
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d reference/hufsability
          test ! -d templates/real5-intake
          test ! -d packages/fixtures/real
          test -f packages/fixtures/synthetic/demo-profiles.json
          command -v google-chrome
      - name: Setup supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 pinned
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install lockfile without post-install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI tests
        run: npm run test:web
      - name: Read actual Pages site base path (private unique subdomain supported)
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6 pinned
      - name: Build explicitly synthetic static React bundle
        env:
          VITE_STATIC_PAGES_PREVIEW: 'true'
          # Public project Pages always use /<repo>/; the old private-site
          # root can remain cached after switching repository visibility.
          PAGES_BASE_PATH: ${{ github.event.repository.private == false && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
        run: npm run build:web -- --mode pages-preview
      - name: Require CSP and correct public Pages asset path
        env:
          PAGES_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        run: |
          test -s dist/web/index.html
          grep -Fq "connect-src 'none'" dist/web/index.html
          test -d dist/web/assets
          test ! -e dist/web/.env
          if [ "$PAGES_PUBLIC_REPOSITORY" = 'true' ]; then
            grep -Fq "/${GITHUB_REPOSITORY#*/}/assets/" dist/web/index.html
          fi
      - name: Chrome desktop/mobile smoke with no API requests
        env:
          VITE_STATIC_PAGES_PREVIEW: 'true'
          # Public project Pages always use /<repo>/; the old private-site
          # root can remain cached after switching repository visibility.
          PAGES_BASE_PATH: ${{ github.event.repository.private == false && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
        run: node tools/check_pages_preview.mjs
      - name: Upload Pages artifact (only on default branch)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5 pinned
        with:
          path: dist/web

  deploy:
    name: Publish private Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only built synthetic artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 pinned
