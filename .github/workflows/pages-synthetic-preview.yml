name: Private synthetic UI preview (GitHub Pages)

# Static all-fictitious React UI is built and smoke-tested ONLY. Public deployment
# is disabled under #297 until real server-side school authentication is ready.
# This workflow cannot unpublish an already-live Pages site; a repo admin must.
on:
  pull_request:
    paths:
      - '.github/workflows/pages-synthetic-preview.yml'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/ai/src/**'
      - 'packages/fixtures/synthetic/**'
      - 'tools/check_pages_preview.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify synthetic Pages build (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout allowlisted code-only sources and synthetic fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 pinned
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /packages/contracts/
            /packages/core/
            /packages/ui/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /apps/web/
            /apps/api/
            /tests/api/
            /tools/check_pages_preview.mjs
            /.github/workflows/pages-synthetic-preview.yml
      - name: Reject protected input directories
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d reference/hufsability
          test ! -d templates/real5-intake
          test ! -d packages/fixtures/real
          test -f packages/fixtures/synthetic/demo-profiles.json
          command -v google-chrome
      - name: Setup supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 pinned
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install lockfile without post-install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI tests
        run: npm run test:web
      - name: Build explicitly synthetic static React bundle
        env:
          VITE_STATIC_PAGES_PREVIEW: 'true'
          # Local-only synthetic smoke uses the public project-style base path.
          PAGES_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}
        run: npm run build:web -- --mode pages-preview
      - name: Require CSP and correct public Pages asset path
        env:
          PAGES_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        run: |
          test -s dist/web/index.html
          grep -Fq "connect-src 'none'" dist/web/index.html
          test -d dist/web/assets
          test ! -e dist/web/.env
          if [ "$PAGES_PUBLIC_REPOSITORY" = 'true' ]; then
            grep -Fq "/${GITHUB_REPOSITORY#*/}/assets/" dist/web/index.html
          fi
      - name: Chrome desktop/mobile smoke with no API requests
        env:
          VITE_STATIC_PAGES_PREVIEW: 'true'
          # Local-only synthetic smoke uses the public project-style base path.
          PAGES_BASE_PATH: ${{ format('/{0}', github.event.repository.name) }}
        run: node tools/check_pages_preview.mjs
