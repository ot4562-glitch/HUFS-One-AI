name: TASK-00 synthetic contracts

# Every PR, including stacked branches and security-only changes, is checked.
# Keep the unprivileged pull_request event; never use pull_request_target.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synthetic test subset only (no student CSV, Forms, local raw, reference)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /tests/contracts/
            /tests/consumers/
            /tests/api/
            /tests/fixtures/academic-133.ts
            /tests/integration/
            /tests/e2e/
            /tests/evaluation/
            /apps/api/
            /infra/sql/
            /infra/laya/
            /infra/deploy/
            /infra/ai/
            /infra/ncp/
            /packages/core/
            /packages/ui/
            /apps/web/
            /.github/workflows/task00-contracts.yml
            /.github/workflows/ui-browser-e2e.yml
            /.github/workflows/independent-pr-review.yml
            /tests/release/
            /tests/security/
            /tools/release_entrypoint_gate.mjs
            /tools/release_publication_gate.py
            /tools/release_readiness_gate.py
            /tools/verify_browser_release_surface.py
            /infra/postgres/
            /tools/verify_release_boundary.py
            /tools/audit_private_git_metadata.py
            /tools/private_registry_io.mjs
            /tools/strip_build_sourcemaps.mjs
            /tools/prune_merged_branches.mjs
            /tools/tests/prune-merged-branches.node.mjs
            /tools/audit_entrypoints.mjs
            /tools/entrypoints.json
            /tools/tests/entrypoint-inventory.node.mjs
            /tools/evaluation/
            /docs/INDEPENDENT_EVALUATION.md
            /tools/audit_dependency_licenses.mjs
            /tools/dependency_bom.mjs
            /tools/audit_api_contracts.mjs
            /tools/api_contract_inventory.json
            /tools/tests/api-contract-inventory.node.mjs
            /.github/workflows/release-readiness.yml
            /.dockerignore
      - name: Prove real-student sources are not in this workspace
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - name: Reject protected paths from entire commit tree without reading private blobs
        run: python3 tools/verify_release_boundary.py --committed-tree-only
      - name: Enforce CI trigger and sparse checkout regression policy
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify merged branch cleanup fails closed without any GitHub token
        run: node --test tools/tests/prune-merged-branches.node.mjs
      - name: TypeScript, four-track contracts and synthetic API/React E2E regressions
        run: npm run check
      - name: Compile independent evaluation tools and validate signed synthetic review fixtures
        run: |
          npm run build:evaluation
          npm run test:evaluation:cli
          npm run eval:review -- fixtures --action check
      - name: Verify read-only entrypoint inventory with isolated synthetic Git fixtures
        run: npm run test:entrypoints
      - name: Verify offline license, BOM and API contract inventories with synthetic fixtures
        run: |
          npm run test:dependency-evidence
          npm run test:api-contracts
      - name: Build local fail-closed Fastify API
        run: npm run build:api
      - name: Reject unsafe anonymous responses and false release readiness
        run: |
          node --test tests/security/*.test.mjs
          node tools/release_entrypoint_gate.mjs
      - name: Build synthetic-only public React assets
        run: npm run build:web
      - name: Reject private sources and credentials in compiled publication artifacts
        run: python3 tools/release_publication_gate.py
      - name: Reject unaudited browser persistence and preview exposure
        run: python3 tools/verify_browser_release_surface.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hufs_local_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
          # Preserve the owner suite's explicit isolated loopback-port guard.
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U hufs_local_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout synthetic backend subset only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /tests/api/
            /tests/fixtures/academic-133.ts
            /apps/api/
            /apps/web/
            /infra/sql/
            /packages/core/
            /tools/strip_build_sourcemaps.mjs
            /infra/postgres/
            /tools/check_postgres_migration_plan.mjs
      - name: Prove real-student sources are not in this workspace
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create five empty synthetic databases in the disposable service
        env:
          HUFS_PG_CI_ADMIN_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/postgres
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({connectionString: process.env.HUFS_PG_CI_ADMIN_URL});
          try {
            await pool.query('CREATE DATABASE hufs_one_a2_test');
            await pool.query('CREATE DATABASE hufs_one_full_test');
            await pool.query('CREATE DATABASE hufs_one_calendar_test');
            await pool.query('CREATE DATABASE hufs_one_owner_academics_test');
            await pool.query('CREATE DATABASE hufs_one_migration_test');
            await pool.query('CREATE DATABASE hufs_one_provider_integration_test');
          } finally {
            await pool.end();
          }
          NODE
      - name: Build compiled API for live adapters and process restart proofs
        run: npm run build:api
      - name: Stream synthetic dump and restore with PostgreSQL 18 in a network-isolated container
        run: |
          node_binary="$(node -p 'process.execPath')"
          docker run --rm --network none --cpus=2 --memory=1g --pids-limit=100 \
            -e HUFS_RECOVERY_CONTAINER=synthetic-ci-only \
            --mount "type=bind,source=$node_binary,target=/opt/hufs-node,readonly" \
            --mount "type=bind,source=$PWD/dist,target=/work/dist,readonly" \
            --mount "type=bind,source=$PWD/node_modules,target=/work/node_modules,readonly" \
            --mount "type=bind,source=$PWD/package.json,target=/work/package.json,readonly" \
            --mount "type=bind,source=$PWD/tests/api/fixtures/postgres-recovery-live.mjs,target=/work/tests/api/fixtures/postgres-recovery-live.mjs,readonly" \
            --mount "type=bind,source=$PWD/infra/sql,target=/work/infra/sql,readonly" \
            --mount "type=bind,source=$PWD/infra/postgres/synthetic-recovery-drill.sh,target=/work/infra/postgres/synthetic-recovery-drill.sh,readonly" \
            --entrypoint bash postgres:18 /work/infra/postgres/synthetic-recovery-drill.sh
      - name: Real PostgreSQL migrations, roles, CAS, revocation, limits and Temporal SQL
        env:
          HUFS_A2_PG_LIVE: '1'
          HUFS_A2_PG_LIVE_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_a2_test
          HUFS_PG_CALENDAR_LIVE: '1'
          HUFS_PG_CALENDAR_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_calendar_test
          HUFS_PG_FULL_LIVE: '1'
          HUFS_PG_FULL_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_full_test
          HUFS_PG_OWNER_ACADEMICS_LIVE: '1'
          HUFS_PG_OWNER_ACADEMICS_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:15439/hufs_one_owner_academics_test
          HUFS_PG_MIGRATIONS_LIVE: '1'
          HUFS_PG_MIGRATIONS_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_migration_test
          HUFS_PG_PROVIDER_INTEGRATION_LIVE: '1'
          HUFS_PG_PROVIDER_INTEGRATION_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_provider_integration_test
        run: npx vitest run tests/api/pg-live-opt-in.test.ts tests/api/pg-full-live-opt-in.test.ts tests/api/pg-calendar-live-opt-in.test.ts tests/api/pg-owner-academics-live-opt-in.test.ts tests/api/pg-migrations-live-opt-in.test.ts tests/api/pg-provider-integration-live-opt-in.test.ts tests/api/provider-personal-class-live-opt-in.test.ts tests/api/pg-ai-experience-operator-live-opt-in.test.ts --reporter=verbose

  # Real PostgreSQL evidence for #119/#164, not merely an opt-in SKIP.
  # Separate runner: owner SQL on 15439 and other PG tests cannot collide.
  revision-claims-real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout synthetic backend subset for approved revision claims
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /packages/core/
            /tests/api/
            /tests/fixtures/academic-133.ts
            /apps/api/
            /apps/web/
            /infra/sql/
      - name: Refuse private student input in revision SQL job
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start isolated PostgreSQL 18 on actual loopback port 15439
        run: |
          docker run --detach --rm --name hufs-revision-claims-pg --network host \
            -e POSTGRES_USER=hufs_local_admin -e POSTGRES_PASSWORD=synthetic-ci-only \
            -e POSTGRES_DB=postgres postgres:18 \
            -c listen_addresses=127.0.0.1 -c port=15439
          ready=0
          for i in $(seq 1 30); do
            if docker exec hufs-revision-claims-pg pg_isready -h 127.0.0.1 -p 15439 -U hufs_local_admin -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec -e PGPASSWORD=synthetic-ci-only hufs-revision-claims-pg \
            createdb -h 127.0.0.1 -p 15439 -U hufs_local_admin hufs_one_revision_claims_test
          docker exec -e PGPASSWORD=synthetic-ci-only hufs-revision-claims-pg \
            createdb -h 127.0.0.1 -p 15439 -U hufs_local_admin hufs_one_demo_profile_test
          docker exec -e PGPASSWORD=synthetic-ci-only hufs-revision-claims-pg \
            createdb -h 127.0.0.1 -p 15439 -U hufs_local_admin hufs_one_synthetic_club_test
      - name: Build revision claims contracts
        run: npm run build:contracts
      - name: Execute revision, EMPTY_DEMO and synthetic club SQL and RLS checks
        env:
          HUFS_PG_REVISION_CLAIMS_LIVE: '1'
          HUFS_PG_REVISION_CLAIMS_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:15439/hufs_one_revision_claims_test
          HUFS_PG_DEMO_PROFILE_LIVE: '1'
          HUFS_PG_DEMO_PROFILE_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:15439/hufs_one_demo_profile_test
          HUFS_PG_SYNTHETIC_CLUB_LIVE: '1'
          HUFS_PG_SYNTHETIC_CLUB_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:15439/hufs_one_synthetic_club_test
        run: npx vitest run tests/api/pg-revision-claims-live-opt-in.test.ts tests/api/demo-profile-live-opt-in.test.ts tests/api/synthetic-club-live-opt-in.test.ts --reporter=verbose
      - name: Stop isolated synthetic SQL service
        if: always()
        run: docker stop hufs-revision-claims-pg || true
