name: TASK-00 synthetic contracts

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - packages/contracts/**
      - packages/fixtures/synthetic/**
      - packages/fixtures/negative/**
      - tests/contracts/**
      - tests/consumers/**
      - tests/api/**
      - apps/api/**
      - infra/sql/**
      - packages/core/**
      - apps/web/**
      - .github/workflows/task00-contracts.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - packages/contracts/**
      - packages/fixtures/synthetic/**
      - packages/fixtures/negative/**
      - tests/contracts/**
      - tests/consumers/**
      - tests/api/**
      - apps/api/**
      - infra/sql/**
      - packages/core/**
      - apps/web/**
      - .github/workflows/task00-contracts.yml

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synthetic test subset only (no student CSV, Forms, local raw, reference)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /tests/contracts/
            /tests/consumers/
            /tests/api/
            /apps/api/
            /infra/sql/
            /packages/core/
            /apps/web/
      - name: Prove real-student sources are not in this workspace
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript, four-track contracts, and fail-closed local API regression
        run: npm run check
