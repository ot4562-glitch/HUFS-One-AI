name: TASK-00 synthetic contracts

# Every PR, including stacked branches and security-only changes, is checked.
# Keep the unprivileged pull_request event; never use pull_request_target.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synthetic test subset only (no student CSV, Forms, local raw, reference)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /tests/contracts/
            /tests/consumers/
            /tests/api/
            /tests/integration/
            /tests/e2e/
            /tests/evaluation/
            /apps/api/
            /infra/sql/
            /packages/core/
            /packages/ui/
            /apps/web/
            /.github/workflows/task00-contracts.yml
            /.github/workflows/ui-browser-e2e.yml
            /tests/release/
            /tests/security/
            /tools/release_entrypoint_gate.mjs
            /tools/release_publication_gate.py
            /tools/release_readiness_gate.py
            /tools/verify_browser_release_surface.py
            /tools/verify_release_boundary.py
            /tools/audit_private_git_metadata.py
            /tools/private_registry_io.mjs
            /tools/strip_build_sourcemaps.mjs
            /tools/prune_merged_branches.mjs
            /tools/tests/prune-merged-branches.node.mjs
            /.github/workflows/release-readiness.yml
            /.dockerignore
      - name: Prove real-student sources are not in this workspace
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - name: Enforce CI trigger and sparse checkout regression policy
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify merged branch cleanup fails closed without any GitHub token
        run: node --test tools/tests/prune-merged-branches.node.mjs
      - name: TypeScript, four-track contracts and synthetic API/React E2E regressions
        run: npm run check
      - name: Build local fail-closed Fastify API
        run: npm run build:api
      - name: Reject unsafe anonymous responses and false release readiness
        run: |
          node --test tests/security/*.test.mjs
          node tools/release_entrypoint_gate.mjs
      - name: Build synthetic-only public React assets
        run: npm run build:web
      - name: Reject private sources and credentials in compiled publication artifacts
        run: python3 tools/release_publication_gate.py
      - name: Reject unaudited browser persistence and preview exposure
        run: python3 tools/verify_browser_release_surface.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hufs_local_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hufs_local_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout synthetic backend subset only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /packages/contracts/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /tests/api/
            /apps/api/
            /infra/sql/
            /packages/core/
            /tools/strip_build_sourcemaps.mjs
      - name: Prove real-student sources are not in this workspace
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned lockfile without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create three empty synthetic databases in the disposable service
        env:
          HUFS_PG_CI_ADMIN_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/postgres
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({connectionString: process.env.HUFS_PG_CI_ADMIN_URL});
          try {
            await pool.query('CREATE DATABASE hufs_one_a2_test');
            await pool.query('CREATE DATABASE hufs_one_full_test');
            await pool.query('CREATE DATABASE hufs_one_calendar_test');
          } finally {
            await pool.end();
          }
          NODE
      - name: Build contracts for the live adapter tests
        run: npm run build:contracts
      - name: Real PostgreSQL migrations, roles, CAS, revocation, limits and Temporal SQL
        env:
          HUFS_A2_PG_LIVE: '1'
          HUFS_A2_PG_LIVE_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_a2_test
          HUFS_PG_CALENDAR_LIVE: '1'
          HUFS_PG_CALENDAR_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_calendar_test
          HUFS_PG_FULL_LIVE: '1'
          HUFS_PG_FULL_URL: postgres://hufs_local_admin:synthetic-ci-only@127.0.0.1:5432/hufs_one_full_test
        run: npx vitest run tests/api/pg-live-opt-in.test.ts tests/api/pg-full-live-opt-in.test.ts tests/api/pg-calendar-live-opt-in.test.ts --reporter=verbose
