name: Temporary read-only code audit snapshot
on:
  push:
    branches: [fix/repository-audit-20261104]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e405cb3df0d04c36f6f747d4345af0bbaaa18f82
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /vitest.config.ts
            /apps/
            /packages/core/
            /packages/contracts/
            /packages/ai/
            /packages/ui/
            /packages/fixtures/synthetic/
            /packages/fixtures/negative/
            /infra/
            /tests/
            /e2e/
            /tools/
            /.github/
            /AGENTS.md
            /README.md
            /STATUS.md
            /Architecture.md
            /CLOUD.md
            /.dockerignore
            /.gitignore
            /docs/PR_WORKFLOW.md
            /docs/WORKSTREAMS.md
          # Explicit path allowlist: never checkout protected originals or .env.
      - name: Export permitted code and review records without executing repository code
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,collections,hashlib,json,os,re,subprocess,tarfile,time,urllib.request,urllib.error
          from pathlib import Path,PurePosixPath
          REPO='minseong-hufs/HUFS-One-AI'
          BASE='e405cb3df0d04c36f6f747d4345af0bbaaa18f82'
          ROOT_DOCS={'AGENTS.md','README.md','STATUS.md','Architecture.md','CLOUD.md','LICENSE','.gitignore','.dockerignore','.gitattributes'}
          DOCS={'docs/PR_WORKFLOW.md','docs/WORKSTREAMS.md','docs/TEAM_PROGRESS.md','docs/DATA_GOVERNANCE.md','docs/SERVICE_DELIVERY_PLAN.md','docs/NCP_OPERATIONS_2026.md','docs/LAYA_CPU_SPIKE_PROTECTION.md'}
          EXTENSIONS={'.ts','.tsx','.js','.mjs','.cjs','.json','.py','.sh','.ps1','.sql','.css','.html','.yml','.yaml','.toml','.conf','.service','.md','.txt','.ini','.cfg'}
          PREFIXES=('apps/','packages/core/','packages/contracts/','packages/ai/','packages/ui/','packages/fixtures/synthetic/','packages/fixtures/negative/','infra/','tests/','e2e/','tools/','scripts/','.github/')
          BLOCKED={'..','.git','node_modules','dist','local_only','csv','real5-intake','reference'}
          def allowed(path):
              if not isinstance(path,str) or not path or '\\' in path or path.startswith('/'): return False
              parts=path.split('/')
              if any(not p or p in BLOCKED for p in parts): return False
              name=parts[-1]
              if name.startswith('.env') or name in {'id_rsa','id_ed25519','.npmrc'}: return False
              if path in ROOT_DOCS or path in DOCS: return True
              if path.startswith(PREFIXES): return PurePosixPath(path).suffix in EXTENSIONS or name in {'Dockerfile','Makefile','.gitignore','.dockerignore'}
              return len(parts)==1 and (PurePosixPath(path).suffix in {'.json','.ts','.mjs','.yml','.yaml','.toml'} or name=='Makefile')
          for path in ('csv/a.csv','local_only/a.json','templates/real5-intake/a.json','reference/hufsability/raw/a.html','packages/fixtures/real/a.json','apps/api/.env','apps/api/key.pem','../apps/api/a.ts','apps/api/../../csv/a.ts','.git/config','apps/api/node_modules/a.ts'):
              assert not allowed(path)
          assert allowed('apps/api/src/server.ts') and allowed('packages/fixtures/synthetic/demo.json')
          assert os.environ.get('GITHUB_REPOSITORY')==REPO
          token=os.environ['GH_READ_TOKEN']
          env=os.environ.copy()
          env.update({'GIT_TERMINAL_PROMPT':'0','GIT_NO_REPLACE_OBJECTS':'1','GIT_LFS_SKIP_SMUDGE':'1','GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()})
          out=Path(os.environ['RUNNER_TEMP'])/'hufs-code-audit';out.mkdir(mode=0o700)
          source,meta,patches=out/'source',out/'metadata',out/'pr-code-patches'
          for path in (source,meta,patches):path.mkdir()
          def git(*args,timeout=120):
              return subprocess.run(['git','-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false',*args],env=env,check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout).stdout
          def save(name,obj):
              (meta/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def api(path):
              if not path.startswith('/repos/'+REPO+'/'):raise RuntimeError('Unexpected API path')
              req=urllib.request.Request('https://api.github.com'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'HUFS-read-only-audit'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=45) as response:data=response.read(16*1024*1024+1)
                      if len(data)>16*1024*1024:raise RuntimeError('Metadata response too large')
                      return json.loads(data)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {429,500,502,503,504} or attempt==2:raise
                      time.sleep(2**attempt)
          def paged(suffix):
              result=[]
              for page in range(1,101):
                  delimiter='&' if '?' in suffix else '?'
                  batch=api('/repos/'+REPO+'/'+suffix+delimiter+f'per_page=100&page={page}')
                  if not isinstance(batch,list):raise RuntimeError('Expected paged list')
                  result.extend(batch)
                  if len(batch)<100:return result
              raise RuntimeError('Incomplete export refused: pagination limit')
          def tree(sha):
              if not re.fullmatch('[0-9a-f]{40}',sha):raise RuntimeError('Invalid commit')
              rows={}
              for item in git('ls-tree','-r','-z',sha).split(b'\0'):
                  if not item:continue
                  header,name=item.split(b'\t',1);mode,kind,blob=header.decode('ascii').split()
                  rows[name.decode('utf-8')]={'mode':mode,'kind':kind,'blob':blob}
              return rows
          def ensure_commit(sha):
              if not re.fullmatch('[0-9a-f]{40}',sha):raise RuntimeError('Invalid commit')
              try:git('cat-file','-e',sha+'^{commit}')
              except subprocess.CalledProcessError:
                  git('fetch','--no-tags','--filter=blob:none','origin',sha)
                  git('cat-file','-e',sha+'^{commit}')
          if git('rev-parse','HEAD').decode().strip()!=BASE:raise RuntimeError('Pinned checkout mismatch')
          for path in ('csv','local_only','templates/real5-intake','reference/hufsability/raw'):
              if Path(path).exists():raise RuntimeError('Protected checkout refused')
          records=tree(BASE);manifest=[];skipped=collections.Counter();total_bytes=0
          for path,item in records.items():
              if not allowed(path):skipped['path_not_in_code_allowlist']+=1;continue
              if item['mode'] not in {'100644','100755'} or item['kind']!='blob':skipped['not_regular_file']+=1;continue
              data=git('show',BASE+':'+path)
              if len(data)>2*1024*1024:raise RuntimeError('Selected file exceeds bound')
              data.decode('utf-8')
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if blob!=item['blob']:raise RuntimeError('Git content hash mismatch')
              total_bytes+=len(data)
              if total_bytes>64*1024*1024:raise RuntimeError('Code export exceeds bound')
              destination=source/path;destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(data);destination.chmod(0o755 if item['mode']=='100755' else 0o644)
              manifest.append({'path':path,'git_blob':blob,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          save('main-manifest.json',manifest)
          save('selection.json',{'base':BASE,'tracked_entries':len(records),'selected_files':len(manifest),'selected_bytes':total_bytes,'excluded_counts':dict(skipped),'excluded_original_contents_read':False})
          print('Selected code snapshot:',len(manifest),'files,',total_bytes,'bytes; protected paths not read',flush=True)
          issues=paged('issues?state=all&sort=created&direction=asc');prs=paged('pulls?state=all&sort=created&direction=asc')
          save('issues-and-pr-index.json',issues);save('pull-requests.json',prs)
          save('issue-comments.json',paged('issues/comments?sort=created&direction=asc'))
          save('review-comments.json',paged('pulls/comments?sort=created&direction=asc'))
          reviews={};patch_index=[]
          for pr in prs:
              number=pr['number'];reviews[str(number)]=paged(f'pulls/{number}/reviews')
              head,base=pr['head']['sha'],pr['base']['sha'];entry={'number':number,'state':pr['state'],'head':head,'base':base}
              try:
                  ensure_commit(head);ensure_commit(base)
                  common=git('merge-base',base,head).decode().strip();before,after=tree(common),tree(head)
                  changed=git('diff','--no-ext-diff','--no-textconv','--no-renames','--name-only','-z',common,head).split(b'\0')
                  selected=[];excluded=0
                  for raw in changed:
                      if not raw:continue
                      path=raw.decode('utf-8');versions=[v for v in (before.get(path),after.get(path)) if v]
                      if allowed(path) and all(v['mode'] in {'100644','100755'} and v['kind']=='blob' for v in versions):selected.append(path)
                      else:excluded+=1
                  patch=git('diff','--no-ext-diff','--no-textconv','--no-renames','--unified=3',common,head,'--',*selected) if selected else b''
                  if len(patch)>8*1024*1024:raise RuntimeError('Patch exceeds bound')
                  (patches/f'{number:04d}.patch').write_bytes(patch)
                  entry.update({'merge_base':common,'selected_paths':selected,'excluded_path_count':excluded,'patch_bytes':len(patch),'status':'EXPORTED'})
              except Exception as exc:entry.update({'status':'UNAVAILABLE','error_type':type(exc).__name__})
              patch_index.append(entry)
          save('reviews.json',reviews);save('patch-index.json',patch_index)
          summary={'base':BASE,'code_files':len(manifest),'ordinary_issues':sum('pull_request' not in i for i in issues),'pull_requests':len(prs),'open_pull_requests':sum(p['state']=='open' for p in prs),'patches_exported':sum(p['status']=='EXPORTED' for p in patch_index),'patches_unavailable':sum(p['status']!='EXPORTED' for p in patch_index)}
          save('summary.json',summary)
          archive=Path(os.environ['RUNNER_TEMP'])/'hufs-code-audit.tar.gz'
          with tarfile.open(archive,'w:gz') as tar:tar.add(out,arcname='hufs-code-audit')
          print(json.dumps(summary,sort_keys=True),flush=True)
          PY
      - name: Retain code-only evidence privately for this review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hufs-read-only-code-audit
          path: ${{ runner.temp }}/hufs-code-audit.tar.gz
          retention-days: 1
          if-no-files-found: error
