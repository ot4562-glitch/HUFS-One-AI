name: NCP IaC offline contracts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-operator-offline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /infra/ncp/
            /tests/release/test_ncp_windows_boundary.py
            /tests/release/check_ncp_winscp_parser.ps1
      - name: Validate converted pins with checksum-pinned real WinSCP parser, without a server connection
        shell: powershell
        env:
          WINSCP_VERSION: '6.7.0'
          WINSCP_NUPKG_SHA256: '40f20147604ae24c3b164a38f867afcf12c30c317885dca38a851f434003c08c'
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'winscp-parser.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'winscp-parser'
          $url = 'https://api.nuget.org/v3-flatcontainer/winscp/' + $env:WINSCP_VERSION + '/winscp.' + $env:WINSCP_VERSION + '.nupkg'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $env:WINSCP_NUPKG_SHA256) { throw 'WinSCP package digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & ./tests/release/check_ncp_winscp_parser.ps1 -AssemblyPath (Join-Path $destination 'lib/net40/WinSCPnet.dll')
      - name: Prove Windows PowerShell 5.1 argv, host pins and fail-closed paths with native offline stubs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'This gate must use Windows PowerShell 5.1.' }
          if ((Test-Path csv) -or (Test-Path local_only)) { throw 'Personal source checkout forbidden.' }
          python -m unittest discover -s tests/release -p test_ncp_windows_boundary.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ubuntu-installer-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /infra/ncp/
            /tools/ingestion/
            /tests/release/test_ncp_operator_workflow.py
      - name: Validate root-owned temporary public-key fixtures without installing or contacting a host
        run: |
          test ! -d csv
          test ! -d local_only
          bash -n infra/ncp/setup/02-install-host.sh
          bash -n infra/ncp/bootstrap-ubuntu.sh
          node --test tools/ingestion/refresh-cli.node.test.mjs tools/ingestion/crawlee-approved-dispatch.node.test.mjs
          sudo python3 -m unittest discover -s tests/release -p test_ncp_operator_workflow.py -v

  network-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /infra/ncp/terraform/
            /tests/release/test_ncp_provider_mirror.py
      - name: Install checksum-pinned Terraform in runner temporary storage
        env:
          TF_VERSION: '1.17.1'
          TF_ZIP_SHA256: '4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/terraform.zip"
          printf '%s  %s\n' "$TF_ZIP_SHA256" "$RUNNER_TEMP/terraform.zip" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/hufs-terraform"
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/hufs-terraform"
      - name: Test NCP provider-mirror integrity and offline failure paths
        run: python3 -m unittest discover -s tests/release -p test_ncp_provider_mirror.py -v
      - name: Restore only the immutable checksum-pinned NCP provider archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hufs-ncloud-provider-mirror
          key: ncloud-provider-4.0.7-linux-amd64-edbaca618aa59b9e5d5b04db1c4aabc34d108015609268ea276ace34eefac285
      - name: Acquire official NCP provider with independent pinned SHA-256
        # Cached ZIP is rehashed. Cold runners try two official endpoints and
        # fail closed when neither yields the exact approved release bytes.
        run: python3 infra/ncp/terraform/provider-mirror.py --mirror "$RUNNER_TEMP/hufs-ncloud-provider-mirror"
      - name: Schema validation and mock-only network/host contracts, no credentials
        run: |
          python3 infra/ncp/terraform/check-offline.py --module network --terraform "$RUNNER_TEMP/hufs-terraform/terraform" --provider-mirror "$RUNNER_TEMP/hufs-ncloud-provider-mirror"
          python3 infra/ncp/terraform/check-offline.py --module host --terraform "$RUNNER_TEMP/hufs-terraform/terraform" --provider-mirror "$RUNNER_TEMP/hufs-ncloud-provider-mirror"
