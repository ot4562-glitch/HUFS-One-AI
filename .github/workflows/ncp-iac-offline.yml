name: NCP IaC offline contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  network-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /infra/ncp/terraform/
      - name: Install checksum-pinned Terraform in runner temporary storage
        env:
          TF_VERSION: '1.17.1'
          TF_ZIP_SHA256: '4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
            --output "$RUNNER_TEMP/terraform.zip"
          printf '%s  %s\n' "$TF_ZIP_SHA256" "$RUNNER_TEMP/terraform.zip" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/hufs-terraform"
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/hufs-terraform"
      - name: Schema validation and mock-only network/host contracts, no credentials
        run: |
          python3 infra/ncp/terraform/check-offline.py --module network --terraform "$RUNNER_TEMP/hufs-terraform/terraform"
          python3 infra/ncp/terraform/check-offline.py --module host --terraform "$RUNNER_TEMP/hufs-terraform/terraform"
