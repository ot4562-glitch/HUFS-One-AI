name: Temporary verified deployment and engine fixes
on:
  push:
    branches: [fix/audit-preview-rollback-20261104]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact code hashes and create Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,urllib.request
          REPO='minseong-hufs/HUFS-One-AI'
          BASE='e405cb3df0d04c36f6f747d4345af0bbaaa18f82'
          TREE='01012485df18694d0726f49e2ac1e03180374e26'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          assert os.environ['GITHUB_REF']=='refs/heads/fix/audit-preview-rollback-20261104'
          parent=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',parent)
          def api(suffix,body=None):
              assert suffix.startswith(('git/blobs','git/trees','git/commits'))
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+suffix,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
                  method='GET' if body is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:data=response.read(1024*1024+1)
              assert len(data)<=1024*1024
              return json.loads(data)
          def digest(text):
              value=text.encode('utf-8')
              return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          payload=json.loads(r'''[{"name":"preview","message":"fix(deploy): restore previous preview after activation failure","files":[{"path":"infra/ncp/deploy-preview.sh","base_blob":"5a590fe114cce6d6164c02ce77dce4ff9a9cc65d","expected":"2a71156e28d82c605efd57655f54da23baeb4028","replacements":[["mv -Tf \"$newlink\" \"$base/current\"\nsystemctl enable hufs-preview.service >/dev/null\nsystemctl restart hufs-preview.service\nok=no\n","mv -Tf \"$newlink\" \"$base/current\"\nrollback_preview() {\n  local rollback_failed=no\n  echo \"Activation failed. Rolling back the preview symlink.\" >&2\n  if [[ -n \"$old\" ]]; then\n    if rm -f \"$newlink\" && ln -s \"$old\" \"$newlink\" && mv -Tf \"$newlink\" \"$base/current\"; then\n      systemctl restart hufs-preview.service || rollback_failed=yes\n    else\n      rollback_failed=yes\n    fi\n  else\n    systemctl stop hufs-preview.service || rollback_failed=yes\n    rm -f \"$base/current\" || rollback_failed=yes\n  fi\n  if [[ \"$rollback_failed\" == yes ]]; then\n    echo \"Rollback incomplete; manual recovery required. Do not declare this preview healthy.\" >&2\n  fi\n  journalctl -u hufs-preview.service --no-pager -n 20 >&2 || true\n}\n# set -e alone would exit after a failed enable/restart with the NEW pointer\n# still active. Route activation failures through the same recovery as health.\nif ! systemctl enable hufs-preview.service >/dev/null || ! systemctl restart hufs-preview.service; then\n  rollback_preview\n  exit 1\nfi\nok=no\n"],["if [[ \"$ok\" != yes ]]; then\n  echo \"Health check failed. Rolling back the preview symlink.\" >&2\n  if [[ -n \"$old\" ]]; then\n    ln -s \"$old\" \"$newlink\"\n    mv -Tf \"$newlink\" \"$base/current\"\n    systemctl restart hufs-preview.service\n  else\n    systemctl stop hufs-preview.service || true\n    rm -f \"$base/current\"\n  fi\n  journalctl -u hufs-preview.service --no-pager -n 20 >&2 || true\n  exit 1\n","if [[ \"$ok\" != yes ]]; then\n  rollback_preview\n  exit 1\n"]]},{"path":"tests/release/test_ncp_deploy_recovery.py","expected":"5a6bb284da551b1b98e3c84f5af139413274178e","content":"\"\"\"Run preview deployment orchestration only against an owned temporary sandbox.\n\nAll privileged, package and network commands are replaced at the process boundary;\nZIP validation, extraction, symlink activation and rollback are the real script.\nNo NCP, sudo, systemd service, npm package or network request is executed.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport shlex\nimport os\nfrom pathlib import Path\nimport shutil\nimport subprocess\nimport tempfile\nimport textwrap\nimport unittest\nimport zipfile\n\nROOT = Path(__file__).resolve().parents[2]\nSCRIPT = ROOT / \"infra/ncp/deploy-preview.sh\"\n\n\n@unittest.skipUnless(os.name == \"posix\" and shutil.which(\"bash\") and shutil.which(\"unzip\"),\n                     \"Linux bash and unzip required for isolated script execution\")\nclass PreviewActivationRecoveryTests(unittest.TestCase):\n    def deploy(self, mode: str, previous: bool = True):\n        with tempfile.TemporaryDirectory(prefix=\"hufs-preview-recovery-\") as temporary:\n            root = Path(temporary)\n            base = root / \"preview\"\n            base.mkdir()\n            old = base / \"previous\"\n            if previous:\n                old.mkdir()\n                (old / \"marker\").write_text(\"preserve previous release\", encoding=\"utf-8\")\n                (base / \"current\").symlink_to(old)\n            archive = root / \"synthetic.zip\"\n            with zipfile.ZipFile(archive, \"w\") as bundle:\n                bundle.writestr(\"package-lock.json\", \"{}\")\n                bundle.writestr(\"apps/web/src/main.tsx\", \"export {}\")\n                bundle.writestr(\"infra/ncp/deploy-preview.sh\", \"# synthetic only\")\n            expected = hashlib.sha256(archive.read_bytes()).hexdigest()\n            source = SCRIPT.read_text(encoding=\"utf-8\")\n            # Redirect only fixed filesystem roots; execute the unchanged control flow.\n            replacements = {\n                \"archive=/home/hufs-admin/ncp-preview.zip\": \"archive=\" + str(archive),\n                \"base=/opt/hufs-one/preview\": \"base=\" + str(base),\n                \"/tmp/hufs-preview-reviewed.XXXXXXXX.zip\": str(root / \"sealed.XXXXXXXX.zip\"),\n            }\n            for before, after in replacements.items():\n                self.assertEqual(source.count(before), 1)\n                source = source.replace(before, after)\n            script = root / \"deploy.sh\"\n            script.write_text(source, encoding=\"utf-8\")\n            bin_dir = root / \"bin\"\n            bin_dir.mkdir()\n            shim = bin_dir / \"command-shim\"\n            shim.write_text(textwrap.dedent(\"\"\"\\\n                #!/bin/sh\n                name=${0##*/}\n                printf '%s\\\\n' \"$name $*\" >> \"$SYNTHETIC_ROOT/commands.log\"\n                case \"$name\" in\n                  id) [ \"$*\" = '-u' ] || exit 99; printf '0\\\\n';;\n                  node) [ \"$1\" = '-p' ] || exit 99; printf '24\\\\n';;\n                  stat)\n                    [ \"$1\" = '-c' ] || exit 99\n                    if [ \"$2\" = '%U' ]; then printf 'hufs-admin\\\\n'; else /usr/bin/stat \"$@\"; fi;;\n                  systemctl)\n                    [ \"$#\" -eq 2 ] && [ \"$2\" = hufs-preview.service ] || exit 99\n                    if [ \"$1\" = enable ] && [ \"$SYNTHETIC_MODE\" = enable-failure ]; then exit 1; fi\n                    if [ \"$1\" = restart ]; then\n                      count=0\n                      if [ -f \"$SYNTHETIC_ROOT/restarts\" ]; then read -r count < \"$SYNTHETIC_ROOT/restarts\"; fi\n                      count=$((count+1)); printf '%s\\\\n' \"$count\" > \"$SYNTHETIC_ROOT/restarts\"\n                      if [ \"$SYNTHETIC_MODE\" = rollback-failure ]; then exit 1; fi\n                      if [ \"$SYNTHETIC_MODE\" = restart-failure ] && [ \"$count\" -eq 1 ]; then exit 1; fi\n                    fi;;\n                  curl) [ \"$SYNTHETIC_MODE\" != health-failure ] || exit 1;;\n                  runuser) [ \"$1\" = '-u' ] && [ \"$2\" = hufs-preview ] && [ \"$3\" = '--' ] || exit 99;;\n                  npm|chown|sleep|journalctl) :;;\n                  *) exit 99;;\n                esac\n                exit 0\n                \"\"\"), encoding=\"utf-8\")\n            shim.chmod(0o755)\n            for name in (\"id\", \"node\", \"npm\", \"stat\", \"chown\", \"runuser\", \"systemctl\", \"curl\", \"sleep\", \"journalctl\"):\n                (bin_dir / name).symlink_to(shim)\n            environment = {\"PATH\": str(bin_dir) + os.pathsep + os.environ.get(\"PATH\", \"\"),\n                           \"SUDO_USER\": \"hufs-admin\", \"SYNTHETIC_ROOT\": str(root),\n                           \"SYNTHETIC_MODE\": mode, \"HOME\": str(root)}\n            result = subprocess.run([\"bash\", str(script), expected], env=environment,\n                                    capture_output=True, text=True, timeout=20)\n            commands = [shlex.split(line) for line in (root / \"commands.log\").read_text().splitlines()]\n            current = base / \"current\"\n            destination = os.readlink(current) if current.is_symlink() else None\n            if previous:\n                self.assertEqual((old / \"marker\").read_text(), \"preserve previous release\")\n            self.assertFalse(list(root.glob(\"sealed.*.zip\")), \"sealed upload must be removed\")\n            return result, commands, destination, str(old), str(base / \"releases\" / expected)\n\n    def test_restart_failure_restores_previous_release(self):\n        result, commands, current, old, _ = self.deploy(\"restart-failure\")\n        self.assertNotEqual(result.returncode, 0)\n        self.assertEqual(current, old)\n        self.assertEqual(commands.count([\"systemctl\", \"restart\", \"hufs-preview.service\"]), 2)\n        self.assertNotIn(\"OK: SYNTHETIC PREVIEW\", result.stdout)\n\n    def test_enable_failure_restores_previous_release(self):\n        result, commands, current, old, _ = self.deploy(\"enable-failure\")\n        self.assertNotEqual(result.returncode, 0)\n        self.assertEqual(current, old)\n        self.assertIn([\"systemctl\", \"restart\", \"hufs-preview.service\"], commands)\n\n    def test_first_activation_failure_stops_service_and_removes_current_pointer(self):\n        result, commands, current, _, _ = self.deploy(\"restart-failure\", previous=False)\n        self.assertNotEqual(result.returncode, 0)\n        self.assertIsNone(current)\n        self.assertIn([\"systemctl\", \"stop\", \"hufs-preview.service\"], commands)\n\n    def test_health_failure_still_restores_previous_release(self):\n        result, _, current, old, _ = self.deploy(\"health-failure\")\n        self.assertNotEqual(result.returncode, 0)\n        self.assertEqual(current, old)\n\n    def test_failed_rollback_is_not_reported_as_success(self):\n        result, commands, current, old, _ = self.deploy(\"rollback-failure\")\n        self.assertNotEqual(result.returncode, 0)\n        self.assertEqual(current, old)\n        self.assertIn(\"manual recovery required\", result.stderr)\n        self.assertIn([\"journalctl\", \"-u\", \"hufs-preview.service\", \"--no-pager\", \"-n\", \"20\"], commands)\n        self.assertNotIn(\"OK: SYNTHETIC PREVIEW\", result.stdout)\n\n    def test_success_keeps_the_new_release(self):\n        result, commands, current, _, release = self.deploy(\"ok\")\n        self.assertEqual(result.returncode, 0, result.stderr)\n        self.assertEqual(current, release)\n        self.assertEqual(commands.count([\"systemctl\", \"restart\", \"hufs-preview.service\"]), 1)\n        self.assertIn(\"OK: SYNTHETIC PREVIEW\", result.stdout)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"}]},{"name":"engines","message":"fix(deps): align declared Node support with pinned dependency engines","files":[{"path":"package.json","base_blob":"53809267be32c41f1f8fa1002fa71661e1fddba8","expected":"8d20a6be9680b959ce7926807a098ceb1efe27d4","replacements":[["  \"engines\": {\n    \"node\": \">=22.12.0\"\n  },\n","  \"engines\": {\n    \"node\": \"^22.22.2 || ^24.15.0\"\n  },\n"]]},{"path":"package-lock.json","base_blob":"4de2ae79fe9d12bc310900b595cb07f62dcedb3c","expected":"784c6defe16ba0fded031eeeef06ec633f9eba7a","replacements":[["      \"engines\": {\n        \"node\": \">=22.12.0\"\n      }\n","      \"engines\": {\n        \"node\": \"^22.22.2 || ^24.15.0\"\n      }\n"]]},{"path":"README.md","base_blob":"749c7d1daf20c0b4ab6fd01afd51f2a2036aef7d","expected":"135ff3dbb21da58a07a4bfd8a5acd62e1a609968","replacements":[["Node.js 22.12+","Node.js 22.22.2+ (22.x) / 24.15.0+ (24.x)"]]},{"path":"packages/contracts/README.md","base_blob":"53059da6b609bece3202cf8d33f04b8389d98427","expected":"746d3c110fcbdad6b1697161d362d602cb5eb28e","replacements":[["Node >=22.12","Node 22.22.2+ (22.x) / 24.15.0+ (24.x)"]]}]}]''')
          allowed={'infra/ncp/deploy-preview.sh','tests/release/test_ncp_deploy_recovery.py','package.json','package-lock.json','README.md','packages/contracts/README.md'}
          assert {f['path'] for g in payload for f in g['files']}==allowed
          prepared=[]
          for group in payload:
              entries=[]
              for item in group['files']:
                  if 'content' in item:text=item['content']
                  else:
                      original=api('git/blobs/'+item['base_blob'])
                      assert original['sha']==item['base_blob'] and original['encoding']=='base64'
                      text=base64.b64decode(original['content']).decode('utf-8')
                      assert digest(text)==item['base_blob']
                      for old,new in item['replacements']:
                          assert text.count(old)==1
                          text=text.replace(old,new,1)
                  assert digest(text)==item['expected'],item['path']
                  entries.append({'path':item['path'],'mode':'100644','type':'blob','content':text})
              prepared.append((group,entries))
          results=[]
          for group,entries in prepared:
              tree=api('git/trees',{'base_tree':TREE,'tree':entries})
              commit=api('git/commits',{'message':group['message'],'tree':tree['sha'],
                  'parents':[parent if group['name']=='preview' else BASE]})
              results.append({'name':group['name'],'commit':commit['sha'],'tree':tree['sha']})
          print('VERIFIED_GIT_OBJECTS='+json.dumps(results,separators=(',',':')))
          PY
