name: CodeQL source analysis (no student data)

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "tests/**"
      - "infra/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql-source-analysis.yml"
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  source-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code only (no tracked student or Forms originals)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/
            /packages/
            /tools/
            /tests/
            /infra/
            /.github/codeql/
            /package.json
            /package-lock.json
            /tsconfig.json
      - name: Prove protected sources are absent before indexing
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d reference
          test ! -d assets
      - name: Initialize CodeQL (JavaScript/TypeScript, no build or secrets)
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # pinned v3 ref, 2026-11-04
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze (GitHub code scanning upload)
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # pinned v3 ref, 2026-11-04
        with:
          category: /language:javascript-typescript
