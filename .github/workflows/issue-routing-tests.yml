name: Issue routing unit tests

on:
  pull_request:
    paths:
      - '.github/issue-routing.json'
      - '.github/scripts/issue-router.cjs'
      - '.github/workflows/issue-initial-routing.yml'
      - '.github/workflows/issue-routing-tests.yml'
      - 'tests/automation/issue-router.test.cjs'
  push:
    branches: [main]
    paths:
      - '.github/issue-routing.json'
      - '.github/scripts/issue-router.cjs'
      - '.github/workflows/issue-initial-routing.yml'
      - '.github/workflows/issue-routing-tests.yml'
      - 'tests/automation/issue-router.test.cjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/automation/issue-router.test.cjs
