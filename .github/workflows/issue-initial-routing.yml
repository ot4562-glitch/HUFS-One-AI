name: Issue triage and fair assignment

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'One existing issue number to route (role issues 355-359 are protected)'
        required: true
        type: number
      dry_run:
        description: 'Preview only - do not edit labels or assignees'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

# Serialize assignments so two simultaneous issues cannot read the same load.
concurrency:
  group: issue-triage
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 reviewed commit
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 annotated tag -> pinned commit
        with:
          script: |
            const {routeIssue} = require('./.github/scripts/issue-router.cjs');
            const {owner, repo} = context.repo;
            const manual = context.eventName === 'workflow_dispatch';
            // Both webhook and manual runs must route the *current* issue,
            // never a potentially stale queued event payload.
            const issueNumber = manual
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue?.number;
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1)
              throw new Error('Invalid issue number');
            const issue = (await github.rest.issues.get({owner, repo,
              issue_number: issueNumber})).data;
            const dryRun = manual && String(context.payload.inputs.dry_run) === 'true';
            const result = await routeIssue({github, context, core, issue, dryRun});
            core.info('Routing result: ' + JSON.stringify(result));
