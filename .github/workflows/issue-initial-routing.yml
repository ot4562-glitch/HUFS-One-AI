name: Issue triage and fair assignment

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'One existing issue number to route (role issues 355-359 are protected)'
        required: true
        type: number
      dry_run:
        description: 'Preview only - do not edit labels or assignees'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

# Serialize assignments so two simultaneous issues cannot read the same load.
concurrency:
  group: issue-triage
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {routeIssue} = require('./.github/scripts/issue-router.cjs');
            const {owner, repo} = context.repo;
            const manual = context.eventName === 'workflow_dispatch';
            const issue = manual
              ? (await github.rest.issues.get({owner, repo,
                  issue_number: Number(context.payload.inputs.issue_number)})).data
              : context.payload.issue;
            const dryRun = manual && String(context.payload.inputs.dry_run) === 'true';
            const result = await routeIssue({github, context, core, issue, dryRun});
            core.info('Routing result: ' + JSON.stringify(result));
