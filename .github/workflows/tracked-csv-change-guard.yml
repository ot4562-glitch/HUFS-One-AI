name: Protected tracked CSV change gate (metadata only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  reject-protected-csv-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PR filenames through GitHub API (never checkout student/Forms originals)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          endpoint = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          number = int(os.environ["NUMBER"])
          token = os.environ["GH_TOKEN"]
          protected = []
          for page in range(1, 32):
              uri = f"{endpoint}/repos/{repo}/pulls/{number}/files?per_page=100&page={page}"
              req = Request(uri, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(req, timeout=20) as response:
                  batch = json.load(response)
              if not isinstance(batch, list):
                  raise RuntimeError("GitHub diff metadata unavailable")
              for entry in batch:
                  for field in ("filename", "previous_filename"):
                      path = entry.get(field)
                      if isinstance(path, str) and (path == "csv" or path.startswith("csv/")):
                          protected.append((entry.get("status", "unknown"), field))
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("Pull request file listing exceeds API limit; manual review required")
          if protected:
              # Do not print original filenames or contents, even in error logs.
              raise SystemExit(
                  f"PROTECTED_CSV_CHANGE: {len(protected)} changed original-path entries. "
                  "Read AGENTS.md and issue #362; private human approval required."
              )
          print("PASS: no changed paths under tracked csv/; no original files checked out")
          PY
