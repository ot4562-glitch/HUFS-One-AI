name: Synthetic browser E2E (Chrome, no downloads)

# #126: unprivileged event on *every* PR, including #76 stacked branches.
# This workflow is local-only until approved; never accesses student originals.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-browser-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PW_CHANNEL: chrome
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout allowlisted synthetic UI only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tsconfig.json
            /packages/contracts/
            /packages/ai/src/
            /packages/fixtures/synthetic/
            /packages/core/
            /packages/ui/
            /apps/api/
            /apps/web/
            /tools/check_local_account_browser.mjs
            /tools/check_empty_demo_browser.mjs
            /tools/generate_demo_assets.mjs
            /tools/check_synthetic_artwork.mjs
            /tools/strip_build_sourcemaps.mjs
            /.github/workflows/ui-browser-e2e.yml
      - name: Assert no private student or raw data directories were checked out
        run: |
          test ! -d csv
          test ! -d local_only
          test ! -d templates/real5-intake
          test ! -d reference/hufsability/raw
          test ! -d reference/hufsability
      - name: Require executable browser checks and installed Google Chrome
        run: |
          test -f tools/check_local_account_browser.mjs
          node --input-type=module -e "import p from './package.json' with {type:'json'}; if (!p.scripts['test:e2e:web']) process.exit(1)"
          command -v google-chrome
          google-chrome --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install from lockfile without any postinstall browser download
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Korean fonts for Chrome layout and screenshots
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK KR:lang=ko' | grep -F 'Noto Sans CJK KR'
      - name: Run legacy shell and reviewer Playwright Chrome E2E (10 scenarios)
        run: npm run test:e2e:web -- --reporter=list
      - name: Preserve synthetic viewport screenshots for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: synthetic-viewport-screenshots
          path: dist/playwright-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Run isolated synthetic account HTTP and Chrome E2E (9 scenarios)
        run: npm run test:e2e:accounts
      - name: Validate original SVG fallbacks and eight responsive synthetic artworks with hashes
        run: npm run assets:check
      - name: Run EMPTY_DEMO owner UI, real HTTP, cross-tab RESET and Chrome
        run: npm run test:e2e:empty-demo
