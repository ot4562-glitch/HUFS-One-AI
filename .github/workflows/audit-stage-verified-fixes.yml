name: Temporary hash-verified audit commit staging
on:
  push:
    branches: [fix/audit-context-capacity-20261104]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create only verified Git objects; do not move any branch or execute project code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,urllib.request
          REPO='minseong-hufs/HUFS-One-AI'
          BASE='e405cb3df0d04c36f6f747d4345af0bbaaa18f82'
          TREE='01012485df18694d0726f49e2ac1e03180374e26'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          assert os.environ['GITHUB_REF']=='refs/heads/fix/audit-context-capacity-20261104'
          parent=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',parent)
          def api(suffix,body=None):
              assert suffix.startswith(('git/blobs','git/trees','git/commits'))
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+suffix,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
                  method='GET' if body is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read(1024*1024+1)
              assert len(data)<=1024*1024
              return json.loads(data)
          def digest(text):
              value=text.encode('utf-8')
              return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          payload=json.loads(r'''[{"name":"context","message":"fix(api): reclaim expired contexts and enforce capacity after authorization","files":[{"path":"apps/api/src/server.ts","base_blob":"b14d573f9e512be4c90e874311363a15aa7004bd","expected":"edab46d19711db69ff8e3b9552d673c0b9222fb2","replacements":[["  const aiUsage=new Map<string,{minute:number;count:number}>();\n\n","  const aiUsage=new Map<string,{minute:number;count:number}>();\n  // Reclaim and reserve synchronously AFTER asynchronous authorization. Both\n  // roles share the same capacity; no await may split this check and insert.\n  const publishContext=(context:DemoContext)=>{\n    const time=nowEpoch(clock());\n    for(const [id,item] of contexts)if(Date.parse(item.expiresAt)<=time)contexts.delete(id);\n    if(Date.parse(context.expiresAt)<=time)throw new ApiFailure('FORBIDDEN');\n    if(contexts.size>=200)throw new ApiFailure('RATE_LIMITED');\n    contexts.set(context.contextId,context);\n  };\n\n"],["      });\n      if(contexts.size>=200)throw new ApiFailure('RATE_LIMITED');\n      await recheckCurrent(req,actor,context);\n","      });\n      await recheckCurrent(req,actor,context);\n"],["      await recheckCurrent(req,actor,context);\n      contexts.set(context.contextId,context);\n      reply.code(201);\n","      await recheckCurrent(req,actor,context);\n      publishContext(context);\n      reply.code(201);\n"],["    });\n    for(const [id,item] of contexts)if(Date.parse(item.expiresAt)<=time)contexts.delete(id);\n    if(contexts.size>=200)throw new ApiFailure('RATE_LIMITED');\n    await recheckCurrent(req,actor,context,['FEED','NOTICES']);\n","    });\n    await recheckCurrent(req,actor,context,['FEED','NOTICES']);\n"],["    await recheckCurrent(req,actor,context,['FEED','NOTICES']);\n    contexts.set(context.contextId,context);\n    reply.code(201);\n","    await recheckCurrent(req,actor,context,['FEED','NOTICES']);\n    publishContext(context);\n    reply.code(201);\n"]]},{"path":"tests/api/demo-context-capacity.test.ts","expected":"fb691900c167c73d75f508e4f5b99fd02cd7b627","content":"import {afterEach,describe,expect,it} from 'vitest';\nimport {DemoProfileOptionSchema,DemoSnapshotSchema,SharingGrantSchema} from '@hufs-one/contracts';\nimport {createApi} from '../../apps/api/src/server.js';\nimport {MemoryApiRepository} from '../../apps/api/src/repository.js';\nimport {MemoryReviewerAccessStore,issueReviewerInvitation} from '../../apps/api/src/modules/auth/reviewer.js';\nimport type {VerifiedActor} from '../../apps/api/src/types.js';\nimport profiles from '../../packages/fixtures/synthetic/demo-profiles.json';\nimport snapshot from '../../packages/fixtures/synthetic/demo-snapshot.json';\n\nconst ORIGIN='https://context-capacity.example.test';\nconst BEGIN='2026-11-10T00:00:00.000Z',END='2026-12-01T00:00:00.000Z';\nconst apps:Array<ReturnType<typeof createApi>>=[];\nafterEach(async()=>{await Promise.all(apps.splice(0).map(app=>app.close()));});\nasync function fixture(role:'BETA'|'REVIEWER',concurrent=false){\n  let now=BEGIN;\n  const common={actorId:'SYN-CAPACITY',sessionIdHash:'S'.repeat(32),csrfToken:'C'.repeat(32),sessionExpiresAt:END};\n  const actor:VerifiedActor=role==='BETA'?{...common,role,betaAllowed:true,schoolMailProofExpiresAt:END}\n    :{...common,role,verifiedEmail:'judge@example.test',identityProofExpiresAt:END};\n  const parsedProfiles=profiles.profiles.map(p=>DemoProfileOptionSchema.parse(p));\n  const parsedSnapshot=DemoSnapshotSchema.parse(snapshot);\n  const repository=new MemoryApiRepository({profiles:parsedProfiles,projections:[parsedSnapshot],safePackets:[],\n    grants:[SharingGrantSchema.parse({grantId:'SYN-CAPACITY-GRANT',actorId:actor.actorId,\n      demoSubjectId:'S01',version:'G1',expiresAt:END,recordingAllowed:false,displayNameAllowed:false,\n      allowedSections:['FEED','NOTICES','ACADEMICS','EXPERIENCE']})]});\n  const access=new MemoryReviewerAccessStore();\n  // Pause every request after its original capacity check, at the real\n  // asynchronous session-verifier boundary. No timers or network are needed.\n  const verifications=new WeakMap<object,number>();let waiting=0,release!:()=>void;\n  const barrier=new Promise<void>(resolve=>{release=resolve;});\n  const app=createApi({repository,allowedOrigin:ORIGIN,now:()=>now,verifySession:async request=>{\n    if(concurrent&&request.method==='POST'&&request.url==='/api/demo/contexts'){\n      const count=(verifications.get(request)??0)+1;verifications.set(request,count);\n      if(count===2){if(++waiting===205)release();await barrier;}\n    }\n    return actor;\n  },\n    reviewerAccess:access,reviewerDemo:{\n      listProfiles:async()=>parsedProfiles.map(p=>({...p,readiness:'READY' as const,dataMode:'SYNTHETIC' as const})),\n      readSnapshot:async()=>parsedSnapshot,readSafePacket:async()=>null,\n    }});\n  apps.push(app);\n  const headers={origin:ORIGIN,'x-csrf-token':actor.csrfToken};\n  if(role==='REVIEWER'){\n    const invite=await issueReviewerInvitation(access,{startsAt:BEGIN,endsAt:END,maxAccounts:1,label:'Synthetic capacity'},\n      {now:'2026-11-01T00:00:00.000Z'});\n    expect((await app.inject({method:'POST',url:'/api/reviewer/invitations/redeem',headers,\n      payload:{enrollmentCode:invite.enrollmentCode}})).statusCode).toBe(200);\n  }\n  return {app,advance:()=>{now='2026-11-10T00:05:00.000Z';},\n    create:()=>app.inject({method:'POST',url:'/api/demo/contexts',headers,\n      payload:{demoSubjectId:'S01',demoRunId:'SYN-CAPACITY-RUN'}})};\n}\n\ndescribe('bounded context publication after asynchronous authorization',()=>{\n  it.each(['BETA','REVIEWER'] as const)('%s reclaims expired contexts without another role or a restart',async role=>{\n    const f=await fixture(role);let first='';\n    for(let i=0;i<200;i++){\n      const result=await f.create();expect(result.statusCode).toBe(201);\n      if(i===0)first=result.json().contextId;\n    }\n    expect((await f.create()).statusCode).toBe(429);\n    f.advance();\n    expect((await f.create()).statusCode).toBe(201);\n    expect((await f.app.inject({url:'/api/demo/contexts/'+first+'/snapshot'})).statusCode).toBe(403);\n  });\n  it.each(['BETA','REVIEWER'] as const)('%s never exceeds the cap during concurrent authorization awaits',async role=>{\n    const f=await fixture(role,true);\n    const responses=await Promise.all(Array.from({length:205},()=>f.create()));\n    expect(responses.filter(r=>r.statusCode===201)).toHaveLength(200);\n    expect(responses.filter(r=>r.statusCode===429)).toHaveLength(5);\n    expect(new Set(responses.filter(r=>r.statusCode===201).map(r=>r.json().contextId)).size).toBe(200);\n  });\n});\n"}]},{"name":"normalization","message":"fix(core): avoid duplicate key collisions and quadratic history grouping","files":[{"path":"packages/core/src/normalization/dedupe.ts","base_blob":"d690ccf5508cc5b8cb5475a110c6d4d71984747f","expected":"0ab28e4803eb71f1cb165097e1ebcb936aa249ed","replacements":[["export function opportunityDedupeKey(opportunity:Opportunity, sourceUrl?:string):string {\n  return [\n    canonicalUrl(sourceUrl),\n","export function opportunityDedupeKey(opportunity:Opportunity, sourceUrl?:string):string {\n  return JSON.stringify([\n    canonicalUrl(sourceUrl),\n"],["    opportunity.applyClosesAt ?? '',\n  ].join('|');\n}\n","    opportunity.applyClosesAt ?? '',\n  ]);\n}\n"],["):string[][] {\n  const groups = new Map<string, string[]>();\n  for (const o of opportunities) {\n","):string[][] {\n  const groups = new Map<string, Set<string>>();\n  for (const o of opportunities) {\n"],["    const key = opportunityDedupeKey(o, sourceUrlBySnapshotId[o.sourceSnapshotId]);\n    const ids = groups.get(key) ?? [];\n    if (!ids.includes(o.id)) ids.push(o.id);\n    groups.set(key, ids);\n","    const key = opportunityDedupeKey(o, sourceUrlBySnapshotId[o.sourceSnapshotId]);\n    const ids = groups.get(key) ?? new Set<string>();\n    ids.add(o.id);\n    groups.set(key, ids);\n"],["  return [...groups.values()]\n    .filter(ids => ids.length > 1)\n    .map(ids => [...ids].sort(byCodeUnit))\n","  return [...groups.values()]\n    .filter(ids => ids.size > 1)\n    .map(ids => [...ids].sort(byCodeUnit))\n"]]},{"path":"packages/core/src/normalization/revisions.ts","base_blob":"df946b8f76138473869805a9204c14c71239df3e","expected":"5093dc8aa20811e2aad82bfb8598c06ec8439f67","replacements":[["  const bySource = new Map<string, RevisionRecord[]>();\n  for (const r of known) bySource.set(r.sourceId, [...(bySource.get(r.sourceId) ?? []), r]);\n\n","  const bySource = new Map<string, RevisionRecord[]>();\n  for (const r of known) {\n    const bucket=bySource.get(r.sourceId);\n    if(bucket)bucket.push(r);\n    else bySource.set(r.sourceId,[r]);\n  }\n\n"]]},{"path":"packages/core/src/normalization/normalization.test.ts","base_blob":"fbc2678c23c7e46ce1061602eceb52f21f995c03","expected":"73064117c888601a858158563cc1264b6b67c921","replacements":[["\n  it('a re-post with changed apply dates is not silently treated as the same', () => {\n","\n  it('keeps tuple boundaries when organizer or title contains a delimiter', () => {\n    const first=base('A',{organization:'Example|Lab',title:'Grant'});\n    const second=base('B',{organization:'Example',title:'Lab|Grant'});\n    expect(opportunityDedupeKey(first)).not.toBe(opportunityDedupeKey(second));\n    expect(findDuplicateCandidates([first,second])).toEqual([]);\n    expect(findDuplicateCandidates([first,base('C',{organization:'Example|Lab',title:'Grant'})]))\n      .toEqual([['A','C']]);\n  });\n\n  it('deduplicates repeated IDs and keeps stable group order without mutating inputs', () => {\n    const items=Object.freeze([base('C'),base('A'),base('B'),base('A')]);\n    expect(findDuplicateCandidates(items)).toEqual([['A','B','C']]);\n    expect(items.map(item=>item.id)).toEqual(['C','A','B','A']);\n  });\n\n  it('a re-post with changed apply dates is not silently treated as the same', () => {\n"]]},{"path":"packages/core/src/normalization/large-history.test.ts","expected":"0b34cca23b42c454c5ae44b6d7ab2d810aa2bfc4","content":"import {expect,it} from 'vitest';\nimport {selectCurrentRevisions,type RevisionRecord} from './revisions.js';\n\nit('keeps every superseded revision and the final head in a large immutable history',()=>{\n  const revisions=Object.freeze(Array.from({length:4000},(_,i)=>Object.freeze({\n    revisionId:'R'+String(i).padStart(4,'0'),sourceId:'SYN-HISTORY',\n    ...(i?{supersedes:'R'+String(i-1).padStart(4,'0')}:{ }),\n    status:'ACTIVE',changeKind:'CORRECTED',provenance:'SYNTHETIC',permissionRef:'SYN-PERMISSION',\n    fetchedAt:'2026-11-01T00:00:00.000Z',lastVerifiedAt:'2026-11-02T00:00:00.000Z',\n  } satisfies RevisionRecord)));\n  const result=selectCurrentRevisions(revisions,'2026-11-03T00:00:00.000Z');\n  expect(result.current.get('SYN-HISTORY')?.revisionId).toBe('R3999');\n  expect(result.quarantined).toHaveLength(3999);\n  expect(result.quarantined[0]).toEqual({revisionId:'R0000',sourceId:'SYN-HISTORY',reason:'SUPERSEDED'});\n  expect(result.quarantined.at(-1)).toEqual({revisionId:'R3998',sourceId:'SYN-HISTORY',reason:'SUPERSEDED'});\n  const reversed=selectCurrentRevisions([...revisions].reverse(),'2026-11-03T00:00:00.000Z');\n  expect(reversed.quarantined).toEqual(result.quarantined);\n  expect(revisions[0]?.revisionId).toBe('R0000');\n});\n"}]}]''')
          allowed={'apps/api/src/server.ts','tests/api/demo-context-capacity.test.ts','packages/core/src/normalization/dedupe.ts','packages/core/src/normalization/revisions.ts','packages/core/src/normalization/normalization.test.ts','packages/core/src/normalization/large-history.test.ts'}
          assert {f['path'] for group in payload for f in group['files']}==allowed
          prepared=[]
          for group in payload:
              entries=[]
              for item in group['files']:
                  if 'content' in item:text=item['content']
                  else:
                      original=api('git/blobs/'+item['base_blob'])
                      assert original['sha']==item['base_blob'] and original['encoding']=='base64'
                      text=base64.b64decode(original['content']).decode('utf-8')
                      assert digest(text)==item['base_blob']
                      for old,new in item['replacements']:
                          assert text.count(old)==1
                          text=text.replace(old,new,1)
                  assert digest(text)==item['expected']
                  entries.append({'path':item['path'],'mode':'100644','type':'blob','content':text})
              prepared.append((group,entries))
          results=[]
          for group,entries in prepared:
              tree=api('git/trees',{'base_tree':TREE,'tree':entries})
              commit=api('git/commits',{'message':group['message'],'tree':tree['sha'],
                  'parents':[parent if group['name']=='context' else BASE]})
              results.append({'name':group['name'],'commit':commit['sha'],'tree':tree['sha'],
                              'files':[{'path':f['path'],'blob':f['expected']} for f in group['files']]})
          print('VERIFIED_GIT_OBJECTS='+json.dumps(results,separators=(',',':')))
          PY
